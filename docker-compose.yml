version: '3.8'

services:
  hris-bqa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hris_bqa_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=/app/data/sqlite.db
    volumes:
      - hris_sqlite_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  hris_sqlite_data:
    driver: local
